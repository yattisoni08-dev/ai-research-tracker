name: Daily AI Research
on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-ai-research
  cancel-in-progress: false
jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect, analyse and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/daily_research.py
      - name: Commit research database and edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json data/research-db.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish daily AI research edition"
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/tracker.json data/research-db.json _site/data/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
