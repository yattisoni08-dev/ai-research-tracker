name: Daily AI Research
on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-ai-research
  cancel-in-progress: false
jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Research and write daily edition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/daily_research.py
      - name: Commit daily edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish daily AI research edition"
            git push
          fi
      - name: Trigger Netlify deploy hook (optional)
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
            curl --fail --silent --show-error -X POST "$NETLIFY_BUILD_HOOK_URL"
          else
            echo "No Netlify build hook configured; skipping."
          fi
